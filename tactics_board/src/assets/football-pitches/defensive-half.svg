<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Green field background -->
  <rect width="400" height="600" fill="#4ade80"/>
  
  <!-- Field boundaries (defensive half) -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Center line (right edge) -->
  <line x1="380" y1="20" x2="380" y2="580" stroke="white" stroke-width="2"/>
  
  <!-- Center semi-circle (left half) -->
  <path d="M 380 244 A 56 56 0 0 0 380 356" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty area -->
  <rect x="20" y="224.5" width="95" height="151" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Goal area -->
  <rect x="20" y="263.5" width="38" height="73" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty spot -->
  <circle cx="85" cy="300" r="2" fill="white"/>
  
  <!-- Center spot -->
  <circle cx="380" cy="300" r="2" fill="white"/>
  
  <!-- Corner arcs (proper quarter circles) -->
  <path d="M 30 20 A 10 10 0 0 1 20 30" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 30 580 A 10 10 0 0 0 20 570" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty arc (tangent to penalty area, facing away from goal) -->
  <path d="M 115 280 A 20 20 0 0 1 115 320" fill="none" stroke="white" stroke-width="2"/>
</svg>