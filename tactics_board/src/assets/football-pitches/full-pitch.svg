<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Green field background -->
  <rect width="800" height="600" fill="#4ade80"/>
  
  <!-- Field outline with padding -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Center line -->
  <line x1="400" y1="20" x2="400" y2="580" stroke="white" stroke-width="2"/>
  
  <!-- Center circle -->
  <circle cx="400" cy="300" r="56" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Left penalty area -->
  <rect x="20" y="224.5" width="95" height="151" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Left goal area -->
  <rect x="20" y="263.5" width="38" height="73" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Right penalty area -->
  <rect x="685" y="224.5" width="95" height="151" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Right goal area -->
  <rect x="742" y="263.5" width="38" height="73" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty spots -->
  <circle cx="85" cy="300" r="2" fill="white"/>
  <circle cx="715" cy="300" r="2" fill="white"/>
  
  <!-- Center spot -->
  <circle cx="400" cy="300" r="2" fill="white"/>
  
  <!-- Corner arcs (proper quarter circles) -->
  <path d="M 30 20 A 10 10 0 0 1 20 30" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 770 20 A 10 10 0 0 0 780 30" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 30 580 A 10 10 0 0 0 20 570" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 770 580 A 10 10 0 0 1 780 570" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty arcs (tangent to penalty area, facing away from goals) -->
  <path d="M 115 280 A 20 20 0 0 1 115 320" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 685 280 A 20 20 0 0 0 685 320" fill="none" stroke="white" stroke-width="2"/>
</svg>