# docs/labels.yaml
# Canonical label definitions for SimpleAM
# Run: bash scripts/sync-labels.sh to apply
# Re-run after editing this file to sync changes

# === What kind of work? (pick ONE per issue) ===
- name: feat
  color: "0e8a16"
  description: "New feature"

- name: fix
  color: "d73a4a"
  description: "Bug fix"

- name: refactor
  color: "e6e6e6"
  description: "Code improvement (no behaviour change)"

- name: security
  color: "b60205"
  description: "Security fix or improvement"

- name: test
  color: "bfd4f2"
  description: "Test addition or fix"

- name: docs
  color: "0075ca"
  description: "Documentation only"

- name: chore
  color: "ededed"
  description: "Build, config, or tooling"

# === How urgent? (pick ONE per issue) ===
- name: "P1: Critical"
  color: "b60205"
  description: "Must fix immediately"

- name: "P2: High"
  color: "d93f0b"
  description: "Fix this sprint"

- name: "P3: Medium"
  color: "fbca04"
  description: "Fix when convenient"

- name: "P4: Low"
  color: "0e8a16"
  description: "Nice to have"

# === How big? (pick ONE per issue) ===
- name: "effort: small"
  color: "c2e0c6"
  description: "< 2 hours — one file, obvious change"

- name: "effort: medium"
  color: "bfdadc"
  description: "2-8 hours — a few files, clear scope"

- name: "effort: large"
  color: "d4c5f9"
  description: "1-3 days — new route + component + API + tests"

- name: "effort: xlarge"
  color: "e99695"
  description: "3+ days — split into smaller issues first"

# === Where is it now? ===
- name: "status: blocked"
  color: "000000"
  description: "Waiting on external dependency"

- name: "status: in-progress"
  color: "fbca04"
  description: "Actively being worked on"

- name: "status: needs-review"
  color: "5319e7"
  description: "Ready for review"

- name: "status: in-codebase"
  color: "0e8a16"
  description: "Merged and in the codebase"

- name: "status: discovery"
  color: "d4c5f9"
  description: "Being researched or scoped"

# === Claude agent tracking ===
- name: bot-working
  color: "1d76db"
  description: "Claude is working on this"

- name: bot-needs-human
  color: "d93f0b"
  description: "Claude needs human input"

- name: bot-fixed
  color: "0e8a16"
  description: "Claude completed the fix"

# === Workflow control ===
- name: skip-claude-review
  color: "ededed"
  description: "Skip automated code review"
