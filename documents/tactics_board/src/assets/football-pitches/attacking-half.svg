<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Green field background -->
  <rect width="400" height="600" fill="#4ade80"/>
  
  <!-- Field boundaries (attacking half) -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Center line (left edge) -->
  <line x1="20" y1="20" x2="20" y2="580" stroke="white" stroke-width="2"/>
  
  <!-- Center semi-circle (right half) -->
  <path d="M 20 244 A 56 56 0 0 1 20 356" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty area -->
  <rect x="285" y="224.5" width="95" height="151" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Goal area -->
  <rect x="342" y="263.5" width="38" height="73" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty spot -->
  <circle cx="315" cy="300" r="2" fill="white"/>
  
  <!-- Center spot -->
  <circle cx="20" cy="300" r="2" fill="white"/>
  
  <!-- Corner arcs (proper quarter circles) -->
  <path d="M 370 20 A 10 10 0 0 0 380 30" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 370 580 A 10 10 0 0 1 380 570" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Penalty arc (tangent to penalty area, facing away from goal) -->
  <path d="M 285 280 A 20 20 0 0 0 285 320" fill="none" stroke="white" stroke-width="2"/>
</svg>