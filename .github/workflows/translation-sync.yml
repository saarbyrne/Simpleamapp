name: Translation Sync Check

on:
  pull_request:
    paths:
      - 'messages/**'
      - '**/*.tsx'
      - '**/*.ts'
      - '**/*.jsx'
      - '**/*.js'
  push:
    branches:
      - main
      - develop
    paths:
      - 'messages/**'

jobs:
  check-translations:
    name: Check Translation Sync
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check translation sync
        run: npm run i18n:sync:check
        continue-on-error: false

      - name: Comment PR if translations missing
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Translation Sync Check Failed**\n\nSome translation keys are missing in language files. Please run `npm run i18n:sync` locally to add missing keys, then translate the `[TODO: Translate]` placeholders.\n\nSee the workflow logs for details.'
            })

