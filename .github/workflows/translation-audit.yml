name: Translation Audit

on:
  pull_request:
    paths:
      - '**/*.{ts,tsx}'
      - 'messages/**/*.json'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run translation audit
        run: npm run i18n:audit -- --locale es
        continue-on-error: true
      
      - name: Check for hardcoded text
        run: |
          if [ -f translation-audit-report.json ]; then
            HARDCODED_COUNT=$(node -e "const r=require('./translation-audit-report.json'); console.log(r.summary.hardcodedText)")
            MISSING_COUNT=$(node -e "const r=require('./translation-audit-report.json'); console.log(r.summary.missingKeys)")
            
            echo "Found $HARDCODED_COUNT hardcoded strings"
            echo "Found $MISSING_COUNT missing translation keys"
            
            # Fail if too many hardcoded strings (threshold: 900, allowing for some false positives)
            if [ "$HARDCODED_COUNT" -gt 900 ]; then
              echo "❌ Too many hardcoded English strings found: $HARDCODED_COUNT"
              echo "Please review and translate user-facing text."
              exit 1
            fi
            
            if [ "$MISSING_COUNT" -gt 0 ]; then
              echo "⚠️ Missing translation keys: $MISSING_COUNT"
              echo "Please add missing keys to locale files."
            fi
          fi
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-audit-report
          path: |
            translation-audit-report.json
            translation-issues-catalog.json

