name: QA Follow-up

on:
  workflow_run:
    workflows: ["QA"]
    types:
      - completed

jobs:
  notify-failure:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure comment with Codex prompt
        uses: actions/github-script@v7
        with:
          script: |
            const run = github.event.workflow_run;
            if (!run.pull_requests || run.pull_requests.length === 0) {
              core.info('No pull request associated with this workflow run.');
              return;
            }
            const prNumber = run.pull_requests[0].number;
            const summary = [
              `❌ QA workflow failed.`,
              ``,
              `- Workflow: [${run.name}](${run.html_url})`,
              `- Conclusion: ${run.conclusion}`,
              `- Event: ${run.event}`,
              ``,
              `Copy this prompt into Codex or another AI assistant to investigate:`,
              '```',
              `Investigate failing QA workflow run for PR #${prNumber}.`,
              `Workflow URL: ${run.html_url}`,
              `Please diagnose failures using the linked logs and suggest fixes.`,
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: summary
            });
