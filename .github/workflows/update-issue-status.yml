name: Auto Issue Status

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - closed

jobs:
  mark-in-progress:
    name: Mark issue in progress on push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Identify referenced issue
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const regexes = [
              /(?:issue|task)[-_/# ]?(\d+)/i,
              /#(\d{1,6})/
            ];

            const tryExtract = (text) => {
              if (!text) return null;
              for (const regex of regexes) {
                const match = text.match(regex);
                if (match && match[1]) {
                  return match[1];
                }
              }
              return null;
            };

            let issueNumber = tryExtract(branch);

            if (!issueNumber && context.payload.commits) {
              for (const commit of context.payload.commits) {
                issueNumber = tryExtract(commit.message);
                if (issueNumber) break;
              }
            }

            if (!issueNumber) {
              core.info('No issue reference detected in branch name or commit messages.');
              return;
            }

            core.setOutput('issue', issueNumber);

      - name: Update labels
        if: steps.extract.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.extract.outputs.issue }}');
            const labelsToAdd = ['status: in-progress'];
            const labelsToRemove = ['status: discovery', 'status: greenfield'];

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: labelsToAdd,
            });

  mark-complete:
    name: Mark issue complete on merge
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Identify referenced issue
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const title = context.payload.pull_request.title || '';
            const body = context.payload.pull_request.body || '';

            const regexes = [
              /(?:issue|task)[-_/# ]?(\d+)/i,
              /#(\d{1,6})/
            ];

            const tryExtract = (text) => {
              if (!text) return null;
              for (const regex of regexes) {
                const match = text.match(regex);
                if (match && match[1]) {
                  return match[1];
                }
              }
              return null;
            };

            let issueNumber = tryExtract(branch) || tryExtract(title) || tryExtract(body);

            if (!issueNumber) {
              core.info('No issue reference detected in PR metadata.');
              return;
            }

            core.setOutput('issue', issueNumber);

      - name: Update labels
        if: steps.extract.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.extract.outputs.issue }}');
            const labelsToAdd = ['status: in-codebase'];
            const labelsToRemove = ['status: in-progress', 'status: greenfield', 'status: discovery'];

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: labelsToAdd,
            });
