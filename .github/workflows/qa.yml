name: QA

# One job, one `npm ci`. Every check that currently produces a real signal runs
# here in sequence.
#
# This replaced six jobs (lint-typecheck, unit, e2e, visual, accessibility,
# performance) plus two separate translation workflows, which together billed
# ~52 minutes of runner time per run and exhausted the account's monthly Actions
# allowance — which is why CI went dark from 2026-07-24 and the audit findings
# went unnoticed. Most of that time was duplicated work:
#
#   * `test:visual` and `test:a11y` were `--grep` subsets of `test:e2e`, so the
#     visual and accessibility jobs re-ran 292 tests E2E Smoke had already run,
#     each paying its own `npm ci` and full 4-browser Playwright install.
#   * E2E Smoke ran 336 tests to assert one endpoint that returns a hardcoded
#     literal.
#   * Every `@visual` test was `test.skip()`.
#   * Lighthouse never ran at all — `npm run build` failed first, and because
#     build only ran inside that job, a broken build reported as a perf problem.
#
# Before adding a job here, check it produces a signal the steps below don't.
# Real e2e journeys are #195; visual regression is #162; coverage gating is #157.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma parses these at module load, and Next evaluates route modules during
  # `next build`. Nothing connects, and no credentials are involved — a
  # syntactically valid URL is all that is needed to get through the build.
  DATABASE_URL: postgresql://localhost:5432/simpleam_ci
  DIRECT_URL: postgresql://localhost:5432/simpleam_ci
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before `npm ci` on purpose: with no node_modules on disk there is
      # nothing to exclude, the scan covers ~5 MB instead of ~1.5 GB, and a
      # leaked secret fails the run in seconds rather than after a full build.
      #
      # Deliberately NOT gitleaks-action@v2 — that scans git *history*, which
      # this repository's history would fail on forever (#129: a rotated DB
      # password and a data dump across 95 commits, kept rather than rewritten).
      # `gitleaks dir` scans the working tree, so it blocks the next leak
      # without failing on the last one. See .gitleaks.toml.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --config .gitleaks.toml --no-banner --redact

      - uses: actions/setup-node@v4
        with:
          # Must match local dev. npm resolves the optional `@swc/helpers` peer
          # differently across major versions, so a lockfile generated on one
          # Node line is rejected by `npm ci` on another.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

      # Nothing else proves the app compiles. This is the check the old pipeline
      # was missing entirely.
      - run: npm run build

# Deliberately absent, with the issue that restores each:
#
#   Translation parity (`npm run i18n:sync:check`) — currently 3,449 missing keys
#   across 8 locales, so it can only ever be red. Two workflows enforced it and
#   both failed on every commit. #166 cuts the set to en + es, at which point it
#   becomes a check that can pass; #161 wires it back in. A gate that cannot go
#   green teaches everyone to ignore CI, which is how this repo got here.
#
#   E2E / visual / accessibility — the specs are all Storybook-gated (#199) and
#   run zero tests today. #195 adds real journeys, #162 a visual baseline, #194
#   accessibility coverage against real routes. Add the job back with the tests.
#
#   Coverage gating — #157.
#   Lighthouse — deleted with its config; revisit when there are users.
